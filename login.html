<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MashMind Login — Expense Planner</title>
  <meta name="description" content="Sign in to MashMind Expense Planner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    :root {
      --bg: #f3f7fc;
      --card: #fff;
      --line: #dee8f4;
      --text: #132640;
      --muted: #6c7f97;
      --accent: #2f72c0;
      --accent-soft: #eaf2ff;
      --danger: #c53f50;
      --danger-soft: #fff3f5;
      --ok: #128261;
      --shadow: 0 18px 50px rgba(34, 73, 119, .12), 0 3px 10px rgba(34, 73, 119, .05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 8%, rgba(134, 179, 233, .25), transparent 34%),
        radial-gradient(ellipse at 90% 92%, rgba(136, 183, 235, .2), transparent 34%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .home-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
    }

    .home-link:hover { color: var(--accent); }

    h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tabs {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7faff;
    }

    .tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      min-height: 42px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      background: #fff;
      border-color: var(--line);
      color: var(--accent);
    }

    form {
      margin-top: 16px;
      display: grid;
      gap: 11px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: #4f6480;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fbff;
      color: var(--text);
      padding: 11px 12px;
      font: inherit;
    }

    input:focus {
      outline: none;
      border-color: #6b9fd7;
      box-shadow: 0 0 0 3px rgba(74, 136, 205, .14);
      background: #fff;
    }

    .hidden { display: none !important; }

    .note {
      margin: 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.5;
    }

    .error {
      min-height: 18px;
      margin: 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
    }

    .error:not(:empty) {
      background: var(--danger-soft);
      border: 1px solid #f3ccd3;
      border-radius: 9px;
      padding: 8px 10px;
    }

    .submit {
      min-height: 48px;
      border: 1px solid #2f72c0;
      border-radius: 11px;
      background: linear-gradient(110deg, #2e70bc, #4489d5 58%, #377bc7);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .submit[disabled], .tab[disabled] {
      opacity: .65;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: #8ea0b5;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="auth-card" aria-labelledby="authTitle">
    <div class="brand">
      <h1>MashMind / Expense Planner</h1>
      <a class="home-link" href="/">Back to home</a>
    </div>

    <h2 id="authTitle">Sign in</h2>
    <p id="authSubtitle" class="sub">Use your username and password to continue.</p>

    <div class="tabs" role="tablist" aria-label="Authentication mode">
      <button id="tabLogin" class="tab active" type="button">Log in</button>
      <button id="tabRegister" class="tab" type="button">Sign up</button>
    </div>

    <form id="authForm" novalidate>
      <div>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" placeholder="Enter username" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <div id="confirmWrap" class="hidden">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm password">
      </div>

      <div id="turnstileWrap" class="hidden">
        <div id="turnstileBox"></div>
        <p class="note">Human verification is required.</p>
      </div>

      <button id="submitBtn" class="submit" type="submit">Sign in</button>
      <p id="errorText" class="error" aria-live="polite"></p>
      <p class="note">Protected with Cloudflare Turnstile, WAF rate limits, and server-side lockouts.</p>
    </form>

    <div class="footer">
      <span>D1 month data + KV sessions</span>
      <span id="statusNote">Checking status…</span>
    </div>
  </main>

  <script>
    const form = document.getElementById('authForm');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const confirmWrap = document.getElementById('confirmWrap');
    const confirmPassword = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');
    const turnstileWrap = document.getElementById('turnstileWrap');
    const statusNote = document.getElementById('statusNote');

    const AUTH_SESSION_KEY = 'mashmind.auth.unlocked.v2';
    let mode = 'login';
    let hasUsers = true;
    let turnstileEnabled = false;
    let turnstileSiteKey = null;
    let turnstileWidgetID = null;
    let turnstileToken = '';
    let cooldownUntil = 0;
    let cooldownTimer = null;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: { 'content-type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      let payload = {};
      try { payload = await res.json(); } catch {}
      if (!res.ok) {
        const err = new Error(payload?.error || `Request failed (${res.status})`);
        err.status = res.status;
        const retryAfter = Number(res.headers.get('Retry-After') || '0');
        if (Number.isFinite(retryAfter) && retryAfter > 0) err.retryAfterSec = retryAfter;
        throw err;
      }
      return payload;
    }

    function setError(message = '') { errorText.textContent = message; }

    function getCooldownLeft() {
      if (!cooldownUntil) return 0;
      return Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
    }

    function formatCooldown(sec) {
      const s = Math.max(0, Number(sec || 0));
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function clearCooldown() {
      cooldownUntil = 0;
      if (cooldownTimer) {
        clearInterval(cooldownTimer);
        cooldownTimer = null;
      }
    }

    function startCooldown(seconds) {
      cooldownUntil = Date.now() + Math.max(1, Number(seconds || 0)) * 1000;
      if (cooldownTimer) clearInterval(cooldownTimer);

      const tick = () => {
        const left = getCooldownLeft();
        if (left <= 0) {
          clearCooldown();
          submitBtn.disabled = false;
          submitBtn.textContent = mode === 'register' ? 'Create account' : 'Sign in';
          setError('');
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = `Try again in ${formatCooldown(left)}`;
        setError(`Too many attempts. Try again in ${formatCooldown(left)}.`);
      };

      tick();
      cooldownTimer = setInterval(tick, 1000);
    }

    function ensureTurnstileRendered() {
      if (!turnstileEnabled || !turnstileSiteKey) return;
      if (!window.turnstile?.render) return;
      if (turnstileWidgetID !== null) return;
      turnstileWidgetID = window.turnstile.render('#turnstileBox', {
        sitekey: turnstileSiteKey,
        callback: (token) => { turnstileToken = token || ''; },
        'expired-callback': () => { turnstileToken = ''; },
        'error-callback': () => { turnstileToken = ''; },
      });
    }

    function resetTurnstile() {
      turnstileToken = '';
      if (turnstileWidgetID !== null && window.turnstile?.reset) {
        window.turnstile.reset(turnstileWidgetID);
      }
    }

    function updateTurnstileVisibility() {
      const needed = turnstileEnabled && (mode === 'login' || mode === 'register');
      turnstileWrap.classList.toggle('hidden', !needed);
      if (!needed) {
        turnstileToken = '';
        return;
      }
      ensureTurnstileRendered();
      if (turnstileWidgetID === null) setTimeout(ensureTurnstileRendered, 250);
      resetTurnstile();
    }

    function setMode(nextMode) {
      mode = nextMode;
      const isRegister = mode === 'register';
      tabLogin.classList.toggle('active', !isRegister);
      tabRegister.classList.toggle('active', isRegister);
      confirmWrap.classList.toggle('hidden', !isRegister);

      authTitle.textContent = isRegister ? 'Create account' : 'Sign in';
      authSubtitle.textContent = isRegister
        ? 'Set your username and password to start planning.'
        : 'Use your username and password to continue.';
      submitBtn.textContent = isRegister ? 'Create account' : 'Sign in';
      submitBtn.disabled = false;
      setError('');
      clearCooldown();
      updateTurnstileVisibility();
    }

    function validate() {
      const u = username.value.trim();
      const p = password.value;
      const c = confirmPassword.value;

      if (!/^[a-z0-9._-]{3,32}$/i.test(u)) return 'Username must be 3–32 characters (letters, numbers, ., _, -).';
      if (!p) return 'Password is required.';
      if (mode === 'register') {
        if (p.length < 6) return 'Password must be at least 6 characters.';
        if (p !== c) return 'Password confirmation does not match.';
      }

      const cooldown = getCooldownLeft();
      if (cooldown > 0) return `Too many attempts. Try again in ${formatCooldown(cooldown)}.`;
      if (turnstileEnabled && !turnstileToken) return 'Please complete human verification.';
      return '';
    }

    async function fetchStatus() {
      try {
        const res = await api('/api/auth/status');
        hasUsers = !!res?.hasUsers;
        turnstileEnabled = !!res?.turnstileEnabled;
        turnstileSiteKey = res?.turnstileSiteKey || null;
      } catch {
        hasUsers = true;
        turnstileEnabled = false;
        turnstileSiteKey = null;
      }

      if (!hasUsers) {
        statusNote.textContent = 'No account found yet — create your first account.';
        tabLogin.disabled = true;
        setMode('register');
      } else {
        statusNote.textContent = 'Secure account access is active.';
      }
    }

    async function bootstrapSession() {
      try {
        const me = await api('/api/auth/me');
        if (me?.authenticated) {
          sessionStorage.setItem(AUTH_SESSION_KEY, '1');
          window.location.replace('/app.html');
          return;
        }
      } catch {}
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setError('');

      const err = validate();
      if (err) {
        setError(err);
        return;
      }

      const submitLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      tabLogin.disabled = true;
      tabRegister.disabled = true;
      submitBtn.textContent = mode === 'register' ? 'Creating account…' : 'Signing in…';

      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            mode,
            username: username.value.trim(),
            password: password.value,
            confirmPassword: confirmPassword.value,
            turnstileToken,
          }),
        });

        sessionStorage.setItem(AUTH_SESSION_KEY, '1');
        window.location.replace('/app.html');
      } catch (e2) {
        resetTurnstile();
        const retryAfter = Number(e2?.retryAfterSec || 0);
        if (retryAfter > 0) {
          startCooldown(retryAfter);
          return;
        }
        const lockMatch = String(e2?.message || '').match(/try again in\s+(\d+)s/i);
        if (lockMatch) {
          startCooldown(Number(lockMatch[1]));
          return;
        }
        setError(e2?.message || 'Authentication failed. Please try again.');
      } finally {
        tabLogin.disabled = !hasUsers;
        tabRegister.disabled = false;
        if (getCooldownLeft() <= 0) {
          submitBtn.disabled = false;
          submitBtn.textContent = submitLabel;
        }
      }
    });

    (async () => {
      await bootstrapSession();
      await fetchStatus();
      if (hasUsers) setMode('login');
      updateTurnstileVisibility();
    })();
  </script>
</body>
</html>
